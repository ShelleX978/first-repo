<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#667eea" />
    <title>请我喝杯咖啡 ☕</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <section class="card">
            <div class="creator">
                <div class="avatar">
                    <div class="avatar-inner">☕</div>
                </div>
                <div class="creator-info">
                    <h1 class="creator-name">请我喝杯咖啡</h1>
                    <p class="creator-desc">
                        如果你觉得我的工具帮到了你，<br/>
                        欢迎用一杯咖啡的时间支持我 ☕
                    </p>
                </div>
            </div>

            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">选择支持金额</span>
                <span class="divider-line"></span>
            </div>

            <div class="amount-grid" id="amountGrid">
                <button class="amount-btn" data-amount="1" data-label="🌱">
                    <span class="amount-emoji">🌱</span>
                    <span class="amount-value">¥1</span>
                    <span class="amount-label">鼓励一下</span>
                </button>
                <button class="amount-btn" data-amount="5" data-label="☕">
                    <span class="amount-emoji">☕</span>
                    <span class="amount-value">¥5</span>
                    <span class="amount-label">一杯咖啡</span>
                </button>
                <button class="amount-btn active" data-amount="10" data-label="🍰">
                    <span class="amount-emoji">🍰</span>
                    <span class="amount-value">¥10</span>
                    <span class="amount-label">一块蛋糕</span>
                </button>
                <button class="amount-btn" data-amount="30" data-label="🍜">
                    <span class="amount-emoji">🍜</span>
                    <span class="amount-value">¥30</span>
                    <span class="amount-label">一碗拉面</span>
                </button>
                <button class="amount-btn" data-amount="66" data-label="🎁">
                    <span class="amount-emoji">🎁</span>
                    <span class="amount-value">¥66</span>
                    <span class="amount-label">礼物一份</span>
                </button>
                <button class="amount-btn custom" data-amount="custom" data-label="✨">
                    <span class="amount-emoji">✨</span>
                    <span class="amount-value">自定义</span>
                    <span class="amount-label">随心支持</span>
                </button>
            </div>

            <div class="custom-input-wrap" id="customInputWrap" style="display:none;">
                <span class="currency-symbol">¥</span>
                <input type="number" id="customAmount" class="custom-input" placeholder="输入金额" min="1" max="9999" step="1" />
                <span class="currency-text">元</span>
            </div>

            <div class="payment-section">
                <div class="payment-tabs">
                    <button class="payment-tab active" data-method="wechat">
                        <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8.691 2C4.377 2 1 5.05 1 8.803c0 2.15 1.193 4.066 3.06 5.338L3.2 16.937l3.3-1.737c1.09.31 2.26.478 3.48.478.175 0 .348-.01.52-.022a5.725 5.725 0 0 1-.236-1.6c0-3.36 3.02-6.085 6.75-6.085.174 0 .346.008.516.023C16.658 4.708 12.91 2 8.69 2zm-2.4 4.2a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm4.8 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm6.217 2.86c-3.153 0-5.713 2.287-5.713 5.107 0 2.82 2.56 5.107 5.713 5.107.65 0 1.277-.094 1.87-.268l2.688 1.414-.738-2.42c1.478-1.047 2.413-2.58 2.413-4.292 0-2.82-2.56-5.107-5.713-5.107zm-1.92 2.75a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5zm3.84 0a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5z"/>
                        </svg>
                        <span>微信支付</span>
                    </button>
                    <button class="payment-tab" data-method="alipay">
                        <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21.422 15.358c-3.83-1.52-6.056-2.57-7.28-3.22.64-1.12 1.15-2.38 1.5-3.74h-3.38V7.91h4.08v-.92h-4.08V4.9h-1.7c-.3 0-.3.3-.3.3v1.79H6.1v.92h4.46v.45H7v.92h7.35c-.3 1-.68 1.93-1.15 2.75-2.63-.87-4.3-1.46-5.1-1.7-1.35-.4-2.08-.62-2.4-.73-.3-.1-.7-.24-1.2-.35C3.63 10.13 3 10.43 3 10.9c0 .42.4.78 1.15.78.58 0 1.58.15 3 .45.65.13 1.42.35 2.3.63-.8 1.08-1.83 1.95-3.05 2.62-1.35.75-2.7 1.13-4.05 1.13-.43 0-.72.03-.87.08-.45.13-.73.35-.73.68 0 .4.35.65 1.05.65 1.55 0 3.23-.5 5.03-1.48 1.5-.82 2.78-1.92 3.83-3.3 1.63.8 3.75 1.93 6.35 3.4.9.52 1.63.78 2.18.78.45 0 .75-.2.75-.58 0-.33-.27-.58-.8-.73-.15-.05-.35-.1-.6-.13z"/>
                        </svg>
                        <span>支付宝</span>
                    </button>
                    <button class="payment-tab" data-method="international">
                        <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93s3.05-7.44 7-7.93v15.86zm2-.03V12c0-.55-.45-1-1-1s-1 .45-1 1v7.9c3.39-.48 6-3.39 6-6.9s-2.61-6.42-6-6.9V12c0 .55.45 1 1 1s1-.45 1-1V4.07c3.5.51 6 3.48 6 7.93s-2.5 7.42-6 7.93z"/>
                        </svg>
                        <span>海外支持</span>
                    </button>
                </div>

                <div class="payment-content" id="paymentContent">
                    <div class="qr-section" id="qrSection">
                        <div class="qr-wrapper">
                            <div class="qr-placeholder">
                                <div class="qr-pattern">
                                    <div class="corner tl"></div>
                                    <div class="corner tr"></div>
                                    <div class="corner bl"></div>
                                    <div class="qr-center-icon">📱</div>
                                    <div class="qr-pixels"></div>
                                </div>
                            </div>
                            <p class="qr-hint">截图保存二维码<br/>用微信扫描付款</p>
                        </div>
                        <div class="payment-actions">
                            <button class="copy-btn" id="copyBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span>复制收款码</span>
                            </button>
                            <button class="save-btn" id="saveBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                <span>保存二维码</span>
                            </button>
                        </div>
                    </div>

                    <div class="international-section" id="internationalSection" style="display:none;">
                        <p class="intl-desc">如果您在海外，可通过以下方式支持我：</p>
                        <a class="intl-link bmc" href="#" target="_blank" rel="noopener">
                            <div class="intl-icon">☕</div>
                            <div class="intl-info">
                                <span class="intl-name">Buy Me a Coffee</span>
                                <span class="intl-detail">最简单的海外赞助方式</span>
                            </div>
                            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </a>
                        <a class="intl-link paypal" href="#" target="_blank" rel="noopener">
                            <div class="intl-icon">💳</div>
                            <div class="intl-info">
                                <span class="intl-name">PayPal</span>
                                <span class="intl-detail">全球通用的支付方式</span>
                            </div>
                            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </a>
                        <a class="intl-link github" href="#" target="_blank" rel="noopener">
                            <div class="intl-icon">💜</div>
                            <div class="intl-info">
                                <span class="intl-name">GitHub Sponsors</span>
                                <span class="intl-detail">在 GitHub 上赞助支持</span>
                            </div>
                            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <div class="tip-text">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span>本项目完全自愿支持，不影响任何功能使用 ❤️</span>
            </div>
        </section>

        <footer class="footer">
            <p>Made with ❤️ by ShelleX978</p>
        </footer>
    </main>

    <div class="thank-you-overlay" id="thankYouOverlay">
        <div class="thank-you-content">
            <div class="heart-container">
                <div class="heart">❤️</div>
            </div>
            <h2 class="thank-title">感谢你的支持！</h2>
            <p class="thank-desc">你的每一份支持都是我持续更新的动力</p>
            <div class="floating-emojis" id="floatingEmojis"></div>
            <button class="close-btn" id="closeBtn">
                <span>关闭</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
